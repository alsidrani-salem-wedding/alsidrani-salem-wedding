/* إعدادات المناسبة وروابط التواصل */
const PHONE='966505945214';
const welcome=document.getElementById('welcome');
const opening=document.getElementById('opening');
const invitation=document.getElementById('invitation');
const loader=document.getElementById('loader');
const inquiry=document.getElementById('inquiry');
/* إخفاء شاشة التحميل بعد جاهزية الصفحة دون انتظار الشبكة */
requestAnimationFrame(()=>{loader.classList.add('hidden');setTimeout(()=>loader.remove(),350)});
/* إنشاء رابط واتساب باستخدام ترميز عربي آمن */
function whatsapp(message){return 'https://wa.me/'+PHONE+'?text='+encodeURIComponent(message)}
inquiry.href=whatsapp('السلام عليكم، لدي استفسار بخصوص دعوة الزفاف.');
/* فتح الظرف ثم إظهار بطاقة الدعوة دون تأثيرات ثقيلة */
let opened=false;
document.getElementById('openEnvelope').addEventListener('click',()=>{
 if(opened)return;opened=true;opening.classList.add('opening-out');
 setTimeout(()=>{welcome.style.display='none';invitation.style.display='block';window.scrollTo(0,0);requestAnimationFrame(()=>invitation.classList.add('visible'))},550);
});
</script></body></html>
